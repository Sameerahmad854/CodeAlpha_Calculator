<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CodeAlpha Calculator</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="calculator">
      <!-- Calculator Display -->
      <div class="display">
        <div id="previous-display"></div>

        <div id="current-display" aria-live="polite">0</div>
      </div>

      <!-- Calculator Buttons -->
      <div class="buttons">
        <!-- First Row -->
        <button class="span-two clear" data-action="clear">AC</button>

        <button class="operator" data-action="delete">DEL</button>

        <button class="operator" data-operation="/">÷</button>

        <!-- Second Row -->
        <button data-number="7">7</button>

        <button data-number="8">8</button>

        <button data-number="9">9</button>

        <button class="operator" data-operation="*">×</button>

        <!-- Third Row -->
        <button data-number="4">4</button>

        <button data-number="5">5</button>

        <button data-number="6">6</button>

        <button class="operator" data-operation="-">−</button>

        <!-- Fourth Row -->
        <button data-number="1">1</button>

        <button data-number="2">2</button>

        <button data-number="3">3</button>

        <button class="operator" data-operation="+">+</button>

        <!-- Fifth Row -->
        <button data-number="0">0</button>

        <button data-number=".">.</button>

        <button class="equals span-two" data-action="calculate">=</button>
      </div>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
